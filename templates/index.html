<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <h1>Generate a Resume</h1>
  <form method="POST" enctype="multipart/form-data">
    <label for="jobDescription">Job Description:</label><br>
    <textarea name="jobDescription" rows="10" cols="80" required></textarea><br><br>

    <label for="resume">Upload Resume (optional):</label><br>
    <input type="file" name="resume"><br><br>

    <input type="submit" value="Generate Resume">
  </form>

  {% if generated_resume %}
    <hr>
    <h2>Generated Resume</h2>
    <div id="resume-container" style="border:1px solid #ccc; padding:1em; margin-bottom:1em;">
      <pre style="white-space: pre-wrap;">{{ generated_resume }}</pre>
    </div>

    <button onclick="downloadPDF()">Download as PDF (Client-side)</button>
    <a href="/download/docx">Download .docx</a>
    <a href="/download/md">Download .md</a>

    <script>
      function downloadPDF() {
        const element = document.getElementById("resume-container");
        html2pdf()
          .set({
            margin: 0.5,
            filename: 'resume.pdf',
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
          })
          .from(element)
          .save();
      }
    </script>
  {% endif %}

  {% if error %}
    <p style="color:red;">Error: {{ error }}</p>
  {% endif %}
</body>
</html>
